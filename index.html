<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Appearich Reading AI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f2;
    color:#080808;
}

/* HEADER */

header{
    height:70px;
    background:#080808;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.logo span{
    color:#f3d000;
}

header button{
    background:#f3d000;
    border:0;
    padding:11px 17px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */

main{
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.title{
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    margin-bottom:30px;
}

/* BUTTONS */

button{
    cursor:pointer;
}

.primary{
    border:0;
    background:#080808;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
}

.yellow{
    background:#f3d000;
    color:#080808;
}

/* BOOK GRID */

.book-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(210px,1fr));

    gap:20px;
}

.book-card{
    background:white;
    border-radius:14px;
    overflow:hidden;

    box-shadow:
        0 4px 15px rgba(0,0,0,.08);

    cursor:pointer;
    transition:.2s;
}

.book-card:hover{
    transform:translateY(-4px);
}

.book-cover{
    width:100%;
    height:260px;
    object-fit:cover;
    background:#eee;
}

.book-info{
    padding:15px;
}

.book-info h3{
    margin-bottom:7px;
}

.book-info p{
    color:#777;
    font-size:14px;
    margin-top:4px;
}

/* ADMIN */

.admin-box{
    background:white;
    padding:25px;
    border-radius:15px;
    max-width:700px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}

input,
textarea{
    width:100%;

    padding:12px;

    margin-top:8px;

    border:1px solid #ddd;

    border-radius:8px;

    font-size:15px;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.page-editor{
    margin-top:20px;
}

.page-edit{
    background:#f7f7f7;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.page-edit img{
    width:120px;
    height:150px;
    object-fit:cover;
    border-radius:6px;
    margin-bottom:10px;
}

/* BOOK */

.reader{
    max-width:800px;
    margin:auto;
    text-align:center;
}

.reader-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:20px;
}

.page-container{
    background:white;
    padding:12px;

    border-radius:10px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.12);
}

.page-image{
    width:100%;
    max-height:75vh;

    object-fit:contain;

    display:block;
}

.reader-controls{
    margin-top:20px;

    display:flex;
    justify-content:center;

    gap:10px;

    flex-wrap:wrap;
}

/* READING */

.reading-screen{
    max-width:700px;
    margin:auto;
    text-align:center;
}

.mic-circle{
    width:130px;
    height:130px;

    border-radius:50%;

    background:#080808;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:45px auto 25px;

    font-size:48px;
}

.mic-circle.recording{
    background:#d00000;

    animation:pulse 1.2s infinite;
}

@keyframes pulse{

    0%{
        box-shadow:
            0 0 0 0 rgba(208,0,0,.5);
    }

    70%{
        box-shadow:
            0 0 0 25px rgba(208,0,0,0);
    }

    100%{
        box-shadow:
            0 0 0 0 rgba(208,0,0,0);
    }

}

.timer{
    font-size:35px;
    font-weight:bold;
    margin:15px;
}

.status{
    color:#666;
    margin-bottom:20px;
}

/* REFERENCE */

.reference-box{
    background:white;

    border-radius:12px;

    padding:20px;

    margin:20px 0;

    text-align:left;
}

.reference-box h3{
    margin-bottom:10px;
}

.reference-text{
    line-height:1.8;
    color:#444;
}

/* RESULTS */

.results{
    margin-top:30px;
    text-align:left;
}

.score-card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

.score{
    font-size:40px;
    font-weight:bold;
}

.word-results{
    background:white;
    padding:20px;
    border-radius:12px;
}

.word-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.word{
    padding:7px 10px;
    border-radius:6px;
    font-size:14px;
}

.correct{
    background:#dff5df;
    color:#176617;
}

.skipped{
    background:#fff0c2;
    color:#765900;
}

.substituted{
    background:#ffdede;
    color:#8b0000;
}

.extra{
    background:#dcecff;
    color:#084b8a;
}

/* EMPTY */

.empty{
    background:white;
    padding:40px;

    text-align:center;

    border-radius:15px;

    color:#777;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .title{
        font-size:26px;
    }

    main{
        padding:20px 15px;
    }

    .book-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .book-cover{
        height:210px;
    }

}

</style>
</head>


<body>


<header>

<div class="logo">
    Appearich <span>Reading AI</span>
</div>

<button onclick="showSection('admin')">
    + Add Book
</button>

</header>


<main>


<!-- ======================================
     LIBRARY
====================================== -->

<section id="library" class="section active">

<h1 class="title">
    My Books
</h1>

<p class="subtitle">
    Select a book and start reading.
</p>

<div id="bookGrid" class="book-grid"></div>

</section>



<!-- ======================================
     ADMIN
====================================== -->

<section id="admin" class="section">

<h1 class="title">
    Add a Book
</h1>

<p class="subtitle">
    Upload textbook pages and add the expected
    reading text.
</p>


<div class="admin-box">

<label>
    Book title
</label>

<input
    id="bookTitle"
    type="text"
    placeholder="Example: English Grade 3"
>


<label>
    Description
</label>

<textarea
    id="bookDescription"
    placeholder="Example: Primary English textbook"
></textarea>


<label>
    Book pages
</label>

<input
    id="pageUpload"
    type="file"
    accept="image/*"
    multiple
>


<p
id="selectedPages"
style="color:#777;margin-top:8px;">
No pages selected.
</p>


<div
id="pageEditor"
class="page-editor">
</div>


<button
class="primary yellow"
onclick="createBook()">

Create Book

</button>


<button
class="primary"
onclick="showSection('library')"
style="margin-left:8px;">

Cancel

</button>

</div>

</section>



<!-- ======================================
     BOOK VIEWER
====================================== -->

<section id="bookViewer" class="section">

<div class="reader">

<div class="reader-header">

<button
class="primary"
onclick="showSection('library')">

← Books

</button>

<strong id="pageNumber">
Page 1
</strong>

</div>


<div class="page-container">

<img
id="pageImage"
class="page-image"
src=""
alt="Book page">

</div>


<div class="reader-controls">

<button
class="primary"
onclick="previousPage()">

← Previous

</button>


<button
class="primary yellow"
onclick="startReading()">

🎙 Start Reading

</button>


<button
class="primary"
onclick="nextPage()">

Next →

</button>

</div>

</div>

</section>



<!-- ======================================
     READING
====================================== -->

<section id="reading" class="section">

<div class="reading-screen">


<button
class="primary"
onclick="leaveReading()">

← Back

</button>


<h1
class="title"
style="margin-top:30px;">

Reading Time

</h1>


<p class="subtitle">

Read the page in your physical textbook
aloud.

</p>


<!-- EXPECTED TEXT -->

<div class="reference-box">

<h3>
Expected Reading
</h3>

<p
id="referenceText"
class="reference-text">
</p>

</div>


<div
id="micCircle"
class="mic-circle">

🎙️

</div>


<div
id="timer"
class="timer">

00:00

</div>


<p
id="recordingStatus"
class="status">

Press the button when you are ready.

</p>


<button
id="recordButton"
class="primary yellow"
onclick="toggleRecording()">

🎙 Start Recording

</button>


<div
id="results"
class="results">
</div>


</div>

</section>


</main>



<script>

/* =====================================================
   DATA
===================================================== */

let books =
JSON.parse(
    localStorage.getItem(
        "appearich_books"
    )
) || [];


let currentBook = null;

let currentPage = 0;


let mediaRecorder = null;

let audioChunks = [];

let recording = false;


let timerInterval = null;

let recordingSeconds = 0;


let recognition = null;

let recognizedText = "";


/* =====================================================
   NAVIGATION
===================================================== */

function showSection(id){

    document
        .querySelectorAll(".section")
        .forEach(section => {

            section.classList.remove(
                "active"
            );

        });


    document
        .getElementById(id)
        .classList.add("active");

}


/* =====================================================
   FILE UPLOAD
===================================================== */

document
.getElementById("pageUpload")
.addEventListener(
    "change",
    preparePages
);


function preparePages(){

    const files =
        Array.from(
            document
            .getElementById("pageUpload")
            .files
        );


    const editor =
        document
        .getElementById("pageEditor");


    editor.innerHTML = "";


    if(!files.length){

        document
        .getElementById("selectedPages")
        .textContent =
        "No pages selected.";

        return;
    }


    files.sort(
        (a,b)=>
        a.name.localeCompare(
            b.name,
            undefined,
            {numeric:true}
        )
    );


    document
    .getElementById("selectedPages")
    .textContent =
    files.length +
    " page(s) selected.";


    files.forEach(
        (file,index)=>{

            const reader =
                new FileReader();


            reader.onload =
                function(e){

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "page-edit";


                    div.innerHTML = `

                        <strong>
                            Page ${index+1}
                        </strong>

                        <br><br>

                        <img
                            src="${e.target.result}"
                        >

                        <label>
                            Expected text
                        </label>

                        <textarea
                            class="reference-input"
                            data-page="${index}"
                            placeholder="Type the exact text the student should read on this page..."
                        ></textarea>

                    `;


                    editor.appendChild(
                        div
                    );

                };


            reader.readAsDataURL(file);

        }
    );

}


/* =====================================================
   CREATE BOOK
===================================================== */

async function createBook(){

    const title =
        document
        .getElementById("bookTitle")
        .value
        .trim();


    const description =
        document
        .getElementById("bookDescription")
        .value
        .trim();


    const files =
        Array.from(
            document
            .getElementById("pageUpload")
            .files
        );


    if(!title){

        alert(
            "Please enter a book title."
        );

        return;
    }


    if(!files.length){

        alert(
            "Please upload the book pages."
        );

        return;
    }


    const inputs =
        Array.from(
            document
            .querySelectorAll(
                ".reference-input"
            )
        );


    const references =
        {};


    inputs.forEach(input=>{

        references[
            input.dataset.page
        ] =
        input.value.trim();

    });


    files.sort(
        (a,b)=>
        a.name.localeCompare(
            b.name,
            undefined,
            {numeric:true}
        )
    );


    const pages = [];


    for(
        let i=0;
        i<files.length;
        i++
    ){

        const image =
            await readFile(files[i]);


        pages.push({

            pageNumber:i+1,

            image:image,

            referenceText:
                references[i] || ""

        });

    }


    const book = {

        id:Date.now(),

        title:title,

        description:description,

        cover:pages[0].image,

        pages:pages,

        createdAt:
            new Date().toISOString()

    };


    books.push(book);


    localStorage.setItem(
        "appearich_books",
        JSON.stringify(books)
    );


    alert(
        "Book created successfully!"
    );


    document
    .getElementById("bookTitle")
    .value="";


    document
    .getElementById("bookDescription")
    .value="";


    document
    .getElementById("pageUpload")
    .value="";


    document
    .getElementById("pageEditor")
    .innerHTML="";


    loadBooks();

    showSection("library");

}


function readFile(file){

    return new Promise(
        resolve=>{

            const reader =
                new FileReader();


            reader.onload =
                e=>resolve(
                    e.target.result
                );


            reader.readAsDataURL(file);

        }
    );

}


/* =====================================================
   LOAD BOOKS
===================================================== */

function loadBooks(){

    const grid =
        document
        .getElementById("bookGrid");


    grid.innerHTML="";


    if(!books.length){

        grid.innerHTML = `

            <div class="empty">

                <h3>
                    No books yet
                </h3>

                <p>
                    Add your first textbook.
                </p>

            </div>

        `;

        return;
    }


    books.forEach(book=>{

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "book-card";


        card.innerHTML = `

            <img
                class="book-cover"
                src="${book.cover}"
            >

            <div class="book-info">

                <h3>
                    ${escapeHTML(book.title)}
                </h3>

                <p>
                    ${book.pages.length}
                    pages
                </p>

                <p>
                    ${escapeHTML(
                        book.description || ""
                    )}
                </p>

            </div>

        `;


        card.onclick =
            ()=>openBook(book.id);


        grid.appendChild(card);

    });

}


/* =====================================================
   OPEN BOOK
===================================================== */

function openBook(id){

    currentBook =
        books.find(
            book=>book.id===id
        );


    currentPage=0;


    updatePage();


    showSection(
        "bookViewer"
    );

}


/* =====================================================
   UPDATE PAGE
===================================================== */

function updatePage(){

    if(!currentBook)
        return;


    const page =
        currentBook.pages[
            currentPage
        ];


    document
    .getElementById("pageImage")
    .src=page.image;


    document
    .getElementById("pageNumber")
    .textContent=
    `Page ${currentPage+1} of ${currentBook.pages.length}`;

}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function nextPage(){

    if(
        currentPage <
        currentBook.pages.length-1
    ){

        currentPage++;

        updatePage();

    }

}


function previousPage(){

    if(currentPage>0){

        currentPage--;

        updatePage();

    }

}


/* =====================================================
   START READING
===================================================== */

function startReading(){

    const page =
        currentBook.pages[
            currentPage
        ];


    document
    .getElementById("referenceText")
    .textContent =
        page.referenceText ||
        "No reference text has been entered for this page.";


    resetReadingUI();


    showSection(
        "reading"
    );

}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

function setupRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        return null;

    }


    const r =
        new SpeechRecognition();


    r.continuous=true;

    r.interimResults=true;

    r.lang="en-US";


    r.onresult =
        function(event){

            let finalText="";


            for(
                let i=0;
                i<event.results.length;
                i++
            ){

                finalText +=
                    event.results[i][0]
                    .transcript + " ";

            }


            recognizedText =
                finalText.trim();


            document
            .getElementById("recordingStatus")
            .textContent =
            "Listening: " +
            recognizedText;

        };


    r.onerror =
        function(event){

            console.error(
                "Speech recognition:",
                event.error
            );

        };


    return r;

}


/* =====================================================
   RECORDING
===================================================== */

async function toggleRecording(){

    if(!recording){

        await startRecording();

    }else{

        stopRecording();

    }

}


/* =====================================================
   START RECORDING
===================================================== */

async function startRecording(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        alert(
            "Microphone is unavailable. Open the app through HTTPS or localhost."
        );

        return;

    }


    try{

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio:true
            });


        mediaRecorder =
            new MediaRecorder(
                stream
            );


        audioChunks=[];

        recognizedText="";


        mediaRecorder.ondataavailable =
            event=>{

                if(
                    event.data.size>0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            function(){

                saveRecording();

                analyzeReading();

            };


        mediaRecorder.start();


        /* SPEECH RECOGNITION */

        recognition =
            setupRecognition();


        if(recognition){

            try{

                recognition.start();

            }catch(e){

                console.log(
                    "Recognition already started."
                );

            }

        }


        recording=true;


        document
        .getElementById(
            "recordButton"
        )
        .textContent =
        "⏹ Stop Recording";


        document
        .getElementById(
            "micCircle"
        )
        .classList
        .add("recording");


        document
        .getElementById(
            "recordingStatus"
        )
        .textContent =
        "Listening... Read the page aloud.";


        startTimer();

    }

    catch(error){

        console.error(
            error
        );


        alert(
            "Could not access microphone: "
            + error.name
        );

    }

}


/* =====================================================
   STOP RECORDING
===================================================== */

function stopRecording(){

    if(
        !mediaRecorder ||
        !recording
    )
        return;


    mediaRecorder.stop();


    if(recognition){

        try{

            recognition.stop();

        }catch(e){}

    }


    recording=false;


    mediaRecorder
    .stream
    .getTracks()
    .forEach(
        track=>track.stop()
    );


    stopTimer();


    document
    .getElementById(
        "recordButton"
    )
    .textContent =
    "🎙 Start Recording";


    document
    .getElementById(
        "micCircle"
    )
    .classList
    .remove("recording");


    document
    .getElementById(
        "recordingStatus"
    )
    .textContent =
    "Analyzing your reading...";

}


/* =====================================================
   SAVE AUDIO
===================================================== */

function saveRecording(){

    const blob =
        new Blob(
            audioChunks,
            {
                type:"audio/webm"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const old =
        document.getElementById(
            "results"
        );


    old.innerHTML = `

        <div class="score-card">

            <h3>
                Your Recording
            </h3>

            <br>

            <audio
                controls
                src="${url}">
            </audio>

        </div>

    `;

}


/* =====================================================
   ANALYZE READING
===================================================== */

function analyzeReading(){

    const page =
        currentBook.pages[
            currentPage
        ];


    const expected =
        normalizeText(
            page.referenceText
        );


    const heard =
        normalizeText(
            recognizedText
        );


    if(!expected){

        showNoReference();

        return;

    }


    if(!heard){

        document
        .getElementById("results")
        .innerHTML += `

            <div class="score-card">

                <h3>
                    No speech detected
                </h3>

                <p>
                    Try reading the page again.
                </p>

            </div>

        `;

        return;

    }


    const expectedWords =
        expected.split(" ");


    const heardWords =
        heard.split(" ");


    const comparison =
        compareWords(
            expectedWords,
            heardWords
        );


    displayResults(
        comparison,
        heard
    );

}


/* =====================================================
   TEXT NORMALIZATION
===================================================== */

function normalizeText(text){

    return text
        .toLowerCase()
        .replace(/[.,!?;:"'()]/g,"")
        .replace(/\s+/g," ")
        .trim();

}


/* =====================================================
   WORD COMPARISON
===================================================== */

function compareWords(
    expected,
    heard
){

    const results=[];


    let i=0;

    let j=0;


    let correct=0;

    let skipped=0;

    let substituted=0;

    let extra=0;


    while(
        i<expected.length &&
        j<heard.length
    ){

        if(
            expected[i] ===
            heard[j]
        ){

            results.push({

                type:"correct",

                expected:expected[i],

                heard:heard[j]

            });


            correct++;

            i++;

            j++;

            continue;

        }


        /*
        Check whether the expected word
        appears immediately after the
        current heard word.

        Example:

        Expected:
        the environment is important

        Heard:
        the is important

        */

        if(
            j+1<heard.length &&
            expected[i] === heard[j+1]
        ){

            results.push({

                type:"extra",

                expected:"",

                heard:heard[j]

            });


            extra++;

            j++;

            continue;

        }


        /*
        Check whether the next expected
        word is what was actually heard.

        Example:

        Expected:
        environment

        Heard:
        environmental
        */

        if(
            i+1<expected.length &&
            expected[i+1] === heard[j]
        ){

            results.push({

                type:"skipped",

                expected:expected[i],

                heard:""

            });


            skipped++;

            i++;

            continue;

        }


        /*
        Otherwise treat as substitution.
        */

        results.push({

            type:"substituted",

            expected:expected[i],

            heard:heard[j]

        });


        substituted++;

        i++;

        j++;

    }


    /*
    Remaining expected words
    */

    while(
        i<expected.length
    ){

        results.push({

            type:"skipped",

            expected:expected[i],

            heard:""

        });


        skipped++;

        i++;

    }


    /*
    Remaining heard words
    */

    while(
        j<heard.length
    ){

        results.push({

            type:"extra",

            expected:"",

            heard:heard[j]

        });


        extra++;

        j++;

    }


    const total =
        expected.length;


    const score =
        total === 0
        ? 0
        : Math.round(
            (correct / total) * 100
        );


    return {

        results,

        correct,

        skipped,

        substituted,

        extra,

        score

    };

}


/* =====================================================
   DISPLAY RESULTS
===================================================== */

function displayResults(
    comparison,
    heard
){

    let html = `

        <div class="score-card">

            <h2>
                Reading Result
            </h2>

            <br>

            <div class="score">
                ${comparison.score}%
            </div>

            <p>
                Reading accuracy
            </p>

            <br>

            <p>
                ✓ Correct:
                ${comparison.correct}
            </p>

            <p>
                ⚠ Skipped:
                ${comparison.skipped}
            </p>

            <p>
                🔴 Substituted:
                ${comparison.substituted}
            </p>

            <p>
                🔵 Extra:
                ${comparison.extra}
            </p>

        </div>


        <div class="score-card">

            <h3>
                What Appearich Heard
            </h3>

            <p style="margin-top:10px;line-height:1.7;">
                ${escapeHTML(heard)}
            </p>

        </div>


        <div class="word-results">

            <h3>
                Word Analysis
            </h3>

            <div class="word-list">
    `;


    comparison.results.forEach(
        item=>{

            if(
                item.type==="correct"
            ){

                html += `

                    <span class="word correct">
                        ✓ ${escapeHTML(
                            item.expected
                        )}
                    </span>

                `;

            }


            else if(
                item.type==="skipped"
            ){

                html += `

                    <span class="word skipped">
                        ⚠ Skipped:
                        ${escapeHTML(
                            item.expected
                        )}
                    </span>

                `;

            }


            else if(
                item.type==="substituted"
            ){

                html += `

                    <span class="word substituted">
                        🔴
                        ${escapeHTML(
                            item.expected
                        )}
                        →
                        ${escapeHTML(
                            item.heard
                        )}
                    </span>

                `;

            }


            else if(
                item.type==="extra"
            ){

                html += `

                    <span class="word extra">
                        🔵 Extra:
                        ${escapeHTML(
                            item.heard
                        )}
                    </span>

                `;

            }

        }
    );


    html += `

            </div>

        </div>

    `;


    document
    .getElementById("results")
    .innerHTML += html;

}

/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    recordingSeconds=0;

    updateTimer();


    timerInterval =
        setInterval(
            ()=>{

                recordingSeconds++;

                updateTimer();

            },
            1000
        );

}


function stopTimer(){

    clearInterval(
        timerInterval
    );

}


function updateTimer(){

    const minutes =
        Math.floor(
            recordingSeconds/60
        );


    const seconds =
        recordingSeconds%60;


    document
    .getElementById("timer")
    .textContent =
        String(minutes)
        .padStart(2,"0")
        +
        ":"
        +
        String(seconds)
        .padStart(2,"0");

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
